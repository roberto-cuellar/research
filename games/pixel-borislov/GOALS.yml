# Clon de Pixel Adventure 1 con personajes de Borislov (§11.3).
#
# Sin métrica declarada no arranca un proyecto (§4). Este fichero se escribe
# ANTES que una sola línea de código de juego.

project: games/pixel-borislov
objective: "El personaje se mueve, salta y colisiona con el feel de Pixel Adventure, sin romper el motor heredado"

# Estado: ANDAMIAJE. Los verificadores todavía no existen; las rutas están
# declaradas para que se escriban primero (§2 principio 2). Ninguna métrica
# puede marcarse como alcanzada hasta que su verifier exista y se haya ejecutado.
status: en_curso

metrics:
  # --- PASS_TO_PASS: la línea base heredada. Es lo que NO se puede romper. ---
  - name: suites_heredadas
    kind: functional
    verifier: games/pixel-borislov/tests/       # node --test "tests/*.test.mjs"
    # MEDIDO EN ESTE FORK el 2026-09-05, no heredado del documento.
    # 171 era el total en MrHector con sus 47 modulos. Aqui hay 29, y
    # sintaxis.test.mjs escanea los ficheros PRESENTES: cuenta 31, no 47.
    # El resto de suites da exactamente lo mismo que en el original.
    # 155 es el SUELO heredado, no la meta: es una metrica guardia. Con las 16
    # pruebas del puente nivel->motor la suite va por 171.
    target: 155          # sintaxis 31, level 27, director 17, audio 15, player 12,
                         # physics 11, breakables 11, pushable 11, plate 8,
                         # arquitectura 6, events 6
    direction: maximize
    note: "Si baja de 171 es regresión, no avance. Se revierte; NO se arregla el test (§14.6)."

  # --- FAIL_TO_PASS: lo que demuestra que se arregló algo ---
  - name: mecanicas_con_test
    kind: functional
    verifier: games/pixel-borislov/tests/traps/
    target: 13           # las 13 trampas del inventario real del pack CC0
    direction: maximize
    note: "Cada trampa necesita su test ANTES que su código. El pack manda, no la web."

  # --- Visual ---
  - name: similitud_visual
    kind: visual
    # El verificador es el spec de Playwright, que compara contra el golden
    # versionado. visual.py es la cascada que USA ese spec, no el gate.
    verifier: tests/visual/juego.spec.mjs
    reference: tests/visual/juego.spec.mjs-snapshots/nivel-01-juego-win32.png
    metric: SSIM
    # 0.98 y NO el 0.95 de la plantilla de §6.3. Medido el 2026-09-05: con 0.95
    # un objeto tiene que desplazarse 80 px (20% del ancho) para que SSIM falle.
    # Ver benchmarks/vlm/MEDICIONES.md §6.2.
    target: 0.98
    direction: maximize
    note: "Recalibrar con un barrido propio cuando existan renders reales; este umbral
           viene de una escena sintética, no del contenido final."

  # --- Feel del movimiento ---
  - name: paridad_de_salto
    kind: functional
    verifier: games/pixel-borislov/tests/functional/jump_feel.spec.mjs
    target: 0
    direction: minimize
    note: "Se ajusta TUNING en p_player.js y SURFACE en w_contracts.js. NO se reescribe
           la física. Las animaciones del pack corren a 20 FPS (50 ms/frame): es
           referencia de temporización, no impone render por frames."

stopping:
  max_iterations: 25
  patience: 5
  epsilon: 0.005
  divergence_k: 3
  max_tokens: 500000
  max_wallclock_min: 120

# --- Decisiones de producto ya cerradas por el usuario ---
decisiones:
  arte: "Planos texturizados con el tileset CC0 de 16x16. NO se modela geometría 3D
         de escenario. Fuente: Documents/Games/PixelAdventureHardcore/.../Pixel Adventure 1/Assets/"
  motor: "Copia de los 27 módulos del plataformer a este directorio. MrHector es SOLO LECTURA."
  personajes: "GLB de Borislov ya rigueados. 8 recetas disponibles."

# --- Restricciones heredadas, innegociables ---
restricciones:
  - "El contrato rig_contract.json es ADITIVO: 25 huesos mixamorig + 10 secundarios +
     16 sockets SOCK_. Se añade, nunca se cambia de sitio (§14.11b)."
  - "Prohibido reutilizar los módulos del laberinto: g_maze, r_maze, w_maze*, hu_maze,
     hu_vallas, p_maze_*, r_fondo, r_niebla, r_aura, r_cine, p_cadena, r_procanim (§14.11c)."
  - "Añadir 'type': 'module' al package.json al copiar: los módulos heredados son ESM
     sin declararlo y Node 20 no los cargaría."
  - "En Windows, 'node --test tests/' falla. Usar node --test \"tests/*.test.mjs\"."

riesgo_abierto:
  - "Coherencia visual entre pixel art de 16x16 y personajes GLB de 6.894 tris.
     Se mide con la cascada visual contra una referencia de estilo. No se debate."
